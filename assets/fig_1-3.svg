  <text x="544" y="188" fill="#6A80A0" font-size="9">503 Timeout</text>
  <rect x="650" y="177" width="112" height="12" rx="2" fill="#D4D6DA"/>
  <rect x="650" y="177" width="56" height="12" rx="2" fill="#E86B28"/>
  <text x="772" y="188" fill="#E86B28" font-size="9">50%</text>

  <text x="544" y="211" fill="#6A80A0" font-size="9">429 RateLimit</text>
  <rect x="650" y="200" width="112" height="12" rx="2" fill="#D4D6DA"/>
  <rect x="650" y="200" width="34" height="12" rx="2" fill="#E07820"/>
