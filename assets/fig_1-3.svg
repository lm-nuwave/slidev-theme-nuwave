  <text x="544" y="234" fill="#6A80A0" font-size="9">Other</text>
  <rect x="650" y="223" width="112" height="12" rx="2" fill="#D4D6DA"/>
  <rect x="650" y="223" width="4" height="12" rx="2" fill="#6A80A0"/>
  <text x="772" y="234" fill="#6A80A0" font-size="9">4%</text>

  <line x1="544" y1="250" x2="766" y2="250" stroke="#D4D6DA" stroke-width="1"/>
  <text x="544" y="266" fill="#9BA8B5" font-size="8">Total errors in window: 1,842</text>
  <text x="544" y="280" fill="#9BA8B5" font-size="8">P(error | req): 0.004</text>
  <text x="544" y="295" fill="#9BA8B5" font-size="8">MTTR avg: 4.2 min</text>
</svg>
