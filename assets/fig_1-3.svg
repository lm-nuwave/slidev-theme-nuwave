<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', sans-serif">
  <rect width="800" height="360" fill="#FFFFFF"/>

  <text x="400" y="28" text-anchor="middle" fill="#6A80A0" font-size="11" letter-spacing="3" font-weight="600">OBSERVABILITY DASHBOARD</text>

  <!-- KPI cards row -->
  <rect x="20" y="44" width="168" height="64" rx="3" fill="#ECEEF2" stroke="#D4D6DA" stroke-width="1.5"/>
