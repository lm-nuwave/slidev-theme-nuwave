  <text x="292" y="94" text-anchor="middle" fill="#E07820" font-size="26" font-weight="700">183ms</text>
  <text x="292" y="104" text-anchor="middle" fill="#6A80A0" font-size="8">SLA: 200ms ✓</text>

  <rect x="396" y="44" width="168" height="64" rx="3" fill="#ECEEF2" stroke="#D4D6DA" stroke-width="1.5"/>
