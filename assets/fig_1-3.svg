  <text x="30" y="188" fill="#9BA8B5" font-size="8" text-anchor="end">250</text>
  <text x="30" y="213" fill="#9BA8B5" font-size="8" text-anchor="end">200</text>
  <text x="30" y="238" fill="#9BA8B5" font-size="8" text-anchor="end">150</text>
  <text x="30" y="263" fill="#9BA8B5" font-size="8" text-anchor="end">100</text>
  <text x="30" y="288" fill="#9BA8B5" font-size="8" text-anchor="end">50</text>

