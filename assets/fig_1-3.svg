  <text x="682" y="94" text-anchor="middle" fill="#E86B28" font-size="26" font-weight="700">68%</text>
  <text x="682" y="104" text-anchor="middle" fill="#6A80A0" font-size="8">CPU avg · 8 nodes</text>

  <!-- Line chart: Latency over time -->
  <rect x="20" y="126" width="490" height="180" rx="3" fill="#ECEEF2" stroke="#D4D6DA" stroke-width="1.5"/>
