  <text x="544" y="141" fill="#6A80A0" font-size="9" letter-spacing="2">ERROR BREAKDOWN</text>

  <!-- Bar chart -->
  <text x="544" y="165" fill="#6A80A0" font-size="9">500 Internal</text>
  <rect x="650" y="154" width="112" height="12" rx="2" fill="#D4D6DA"/>
  <rect x="650" y="154" width="18" height="12" rx="2" fill="#D04040"/>
