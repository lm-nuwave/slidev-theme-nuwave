  <g opacity="0.3" stroke="#D4D6DA" stroke-width="0.5">
    <line x1="34" y1="160" x2="496" y2="160"/>
    <line x1="34" y1="185" x2="496" y2="185"/>
    <line x1="34" y1="210" x2="496" y2="210"/>
    <line x1="34" y1="235" x2="496" y2="235"/>
    <line x1="34" y1="260" x2="496" y2="260"/>
    <line x1="34" y1="285" x2="496" y2="285"/>
