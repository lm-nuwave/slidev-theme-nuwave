<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', monospace, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="var(--vp-mauve)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="var(--vp-base)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="var(--vp-blue)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="var(--vp-base)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="420" fill="var(--vp-base)"/>

  <!-- Grid lines -->
  <g stroke="var(--vp-surface0)" stroke-width="0.8" opacity="0.6">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="880" y1="0" x2="880" y2="420"/>
  </g>

  <!-- Glow overlays -->
  <rect width="960" height="420" fill="url(#glow)"/>
  <rect width="960" height="420" fill="url(#glow2)"/>

  <!-- Connection lines between nodes -->
  <g stroke="var(--vp-surface2)" stroke-width="1" opacity="0.7">
    <line x1="240" y1="120" x2="480" y2="210"/>
    <line x1="480" y1="210" x2="720" y2="120"/>
    <line x1="720" y1="120" x2="840" y2="300"/>
    <line x1="480" y1="210" x2="480" y2="60"/>
    <line x1="480" y1="210" x2="160" y2="300"/>
    <line x1="160" y1="300" x2="320" y2="360"/>
    <line x1="720" y1="120" x2="600" y2="300"/>
    <line x1="600" y1="300" x2="840" y2="300"/>
    <line x1="240" y1="120" x2="160" y2="300"/>
  </g>

  <!-- Accent connection lines -->
  <g stroke="var(--vp-mauve)" stroke-width="1.5" opacity="0.4">
    <line x1="480" y1="210" x2="240" y2="120"/>
    <line x1="480" y1="210" x2="720" y2="120"/>
    <line x1="480" y1="210" x2="600" y2="300"/>
  </g>

  <!-- Nodes -->
  <!-- Center large node -->
  <circle cx="480" cy="210" r="18" fill="var(--vp-surface0)" stroke="var(--vp-mauve)" stroke-width="2.5"/>
  <circle cx="480" cy="210" r="8" fill="var(--vp-mauve)" opacity="0.7"/>

  <!-- Satellite nodes -->
  <circle cx="240" cy="120" r="12" fill="var(--vp-surface0)" stroke="var(--vp-blue)" stroke-width="2"/>
  <circle cx="240" cy="120" r="5" fill="var(--vp-blue)" opacity="0.6"/>

  <circle cx="720" cy="120" r="12" fill="var(--vp-surface0)" stroke="var(--vp-teal)" stroke-width="2"/>
  <circle cx="720" cy="120" r="5" fill="var(--vp-teal)" opacity="0.6"/>

  <circle cx="480" cy="60" r="10" fill="var(--vp-surface0)" stroke="var(--vp-blue)" stroke-width="1.5"/>
  <circle cx="480" cy="60" r="4" fill="var(--vp-blue)" opacity="0.5"/>

  <circle cx="160" cy="300" r="10" fill="var(--vp-surface0)" stroke="var(--vp-surface2)" stroke-width="1.5"/>
  <circle cx="160" cy="300" r="4" fill="var(--vp-overlay1)" opacity="0.5"/>

  <circle cx="600" cy="300" r="10" fill="var(--vp-surface0)" stroke="var(--vp-teal)" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="4" fill="var(--vp-teal)" opacity="0.5"/>

  <circle cx="840" cy="300" r="8" fill="var(--vp-surface0)" stroke="var(--vp-surface2)" stroke-width="1.5"/>
  <circle cx="320" cy="360" r="8" fill="var(--vp-surface0)" stroke="var(--vp-surface2)" stroke-width="1.5"/>

  <!-- Small scatter nodes -->
  <circle cx="100" cy="80" r="5" fill="var(--vp-surface0)" stroke="var(--vp-surface1)" stroke-width="1"/>
  <circle cx="860" cy="80" r="5" fill="var(--vp-surface0)" stroke="var(--vp-surface1)" stroke-width="1"/>
  <circle cx="80" cy="200" r="4" fill="var(--vp-surface0)" stroke="var(--vp-surface1)" stroke-width="1"/>
  <circle cx="880" cy="200" r="4" fill="var(--vp-surface0)" stroke="var(--vp-surface1)" stroke-width="1"/>

  <!-- Labels -->
  <text x="480" y="250" text-anchor="middle" fill="var(--vp-mauve)" font-size="10" letter-spacing="2" opacity="0.8">ORCHESTRATOR</text>
  <text x="240" y="152" text-anchor="middle" fill="var(--vp-blue)" font-size="9" letter-spacing="1" opacity="0.7">SERVICE A</text>
  <text x="720" y="152" text-anchor="middle" fill="var(--vp-teal)" font-size="9" letter-spacing="1" opacity="0.7">SERVICE B</text>

  <!-- Subtle corner label -->
  <text x="20" y="405" fill="var(--vp-surface0)" font-size="9" letter-spacing="3">VESPER · DISTRIBUTED SYSTEMS</text>
  <text x="940" y="405" text-anchor="end" fill="var(--vp-surface0)" font-size="9" letter-spacing="3">CATPPUCCIN MOCHA</text>
</svg>
