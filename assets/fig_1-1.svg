<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', monospace, sans-serif">
  <rect width="800" height="500" fill="var(--vp-base)"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="var(--vp-overlay1)" font-size="11" letter-spacing="3" font-weight="600" text-transform="uppercase">MICROSERVICES ARCHITECTURE</text>

  <!-- Client -->
  <rect x="50" y="80" width="130" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-surface2)" stroke-width="1.5"/>
  <text x="115" y="100" text-anchor="middle" fill="var(--vp-blue)" font-size="10" letter-spacing="2" font-weight="700">CLIENT</text>
  <text x="115" y="120" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Web / Mobile</text>

  <!-- Arrow client → gateway -->
  <line x1="180" y1="106" x2="240" y2="106" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- API Gateway -->
  <rect x="240" y="68" width="150" height="76" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-mauve)" stroke-width="2"/>
  <text x="315" y="92" text-anchor="middle" fill="var(--vp-mauve)" font-size="10" letter-spacing="2" font-weight="700">API GATEWAY</text>
  <text x="315" y="112" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Auth · Rate Limit</text>
  <text x="315" y="128" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Load Balance</text>

  <!-- Arrows gateway → services -->
  <line x1="390" y1="90" x2="460" y2="66" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="106" x2="460" y2="106" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="122" x2="460" y2="146" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Service A -->
  <rect x="460" y="44" width="130" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-teal)" stroke-width="1.5"/>
  <text x="525" y="64" text-anchor="middle" fill="var(--vp-teal)" font-size="10" letter-spacing="2" font-weight="700">USER SVC</text>
  <text x="525" y="84" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">:8001</text>

  <!-- Service B -->
  <rect x="460" y="84" width="130" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-teal)" stroke-width="1.5"/>
  <text x="525" y="104" text-anchor="middle" fill="var(--vp-teal)" font-size="10" letter-spacing="2" font-weight="700">ORDER SVC</text>
  <text x="525" y="124" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">:8002</text>

  <!-- Service C -->
  <rect x="460" y="124" width="130" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-teal)" stroke-width="1.5"/>
  <text x="525" y="144" text-anchor="middle" fill="var(--vp-teal)" font-size="10" letter-spacing="2" font-weight="700">NOTIFY SVC</text>
  <text x="525" y="164" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">:8003</text>

  <!-- Arrows services → db/queue -->
  <line x1="590" y1="70" x2="640" y2="80" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="110" x2="640" y2="110" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="150" x2="640" y2="140" stroke="var(--vp-surface2)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PostgreSQL -->
  <rect x="640" y="56" width="120" height="42" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-yellow)" stroke-width="1.5"/>
  <text x="700" y="73" text-anchor="middle" fill="var(--vp-yellow)" font-size="10" letter-spacing="2" font-weight="700">POSTGRES</text>
  <text x="700" y="89" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Primary + Replica</text>

  <!-- Redis -->
  <rect x="640" y="112" width="120" height="42" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-red)" stroke-width="1.5"/>
  <text x="700" y="129" text-anchor="middle" fill="var(--vp-red)" font-size="10" letter-spacing="2" font-weight="700">REDIS</text>
  <text x="700" y="145" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Cache · Pub/Sub</text>

  <!-- ── Second row: Observability ── -->
  <line x1="400" y1="220" x2="400" y2="195" stroke="var(--vp-surface2)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Kafka bus -->
  <rect x="100" y="230" width="600" height="44" rx="3" fill="var(--vp-mantle)" stroke="var(--vp-mauve)" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="248" text-anchor="middle" fill="var(--vp-mauve)" font-size="10" letter-spacing="3" font-weight="700">KAFKA EVENT BUS</text>
  <text x="400" y="264" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">events.orders · events.users · events.notifications</text>

  <!-- Observability row -->
  <rect x="100" y="310" width="170" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-blue)" stroke-width="1.5"/>
  <text x="185" y="330" text-anchor="middle" fill="var(--vp-blue)" font-size="10" letter-spacing="2" font-weight="700">PROMETHEUS</text>
  <text x="185" y="350" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Metrics scraper</text>

  <rect x="300" y="310" width="170" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-blue)" stroke-width="1.5"/>
  <text x="385" y="330" text-anchor="middle" fill="var(--vp-blue)" font-size="10" letter-spacing="2" font-weight="700">GRAFANA</text>
  <text x="385" y="350" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Dashboards</text>

  <rect x="500" y="310" width="170" height="52" rx="3" fill="var(--vp-surface0)" stroke="var(--vp-blue)" stroke-width="1.5"/>
  <text x="585" y="330" text-anchor="middle" fill="var(--vp-blue)" font-size="10" letter-spacing="2" font-weight="700">JAEGER</text>
  <text x="585" y="350" text-anchor="middle" fill="var(--vp-overlay1)" font-size="9">Distributed tracing</text>

  <!-- legend -->
  <rect x="100" y="416" width="12" height="12" fill="none" stroke="var(--vp-mauve)" stroke-width="2"/>
  <text x="120" y="426" fill="var(--vp-overlay1)" font-size="9">Gateway / Bus</text>
  <rect x="230" y="416" width="12" height="12" fill="none" stroke="var(--vp-teal)" stroke-width="1.5"/>
  <text x="250" y="426" fill="var(--vp-overlay1)" font-size="9">Services</text>
  <rect x="340" y="416" width="12" height="12" fill="none" stroke="var(--vp-yellow)" stroke-width="1.5"/>
  <text x="360" y="426" fill="var(--vp-overlay1)" font-size="9">Data stores</text>
  <rect x="460" y="416" width="12" height="12" fill="none" stroke="var(--vp-blue)" stroke-width="1.5"/>
  <text x="480" y="426" fill="var(--vp-overlay1)" font-size="9">Observability</text>

  <!-- horizontal rule bottom -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="var(--vp-surface0)" stroke-width="1"/>
  <text x="400" y="472" text-anchor="middle" fill="var(--vp-surface1)" font-size="9" letter-spacing="2">ALL SERVICES CONTAINERISED · KUBERNETES CLUSTER</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--vp-surface2)"/>
    </marker>
  </defs>
</svg>
