<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', sans-serif">
  <rect width="400" height="320" fill="#FFFFFF"/>

  <!-- Browser chrome mockup -->
  <rect x="10" y="10" width="380" height="24" rx="4" fill="#D4D6DA"/>
