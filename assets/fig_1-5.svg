  <text x="225" y="25" text-anchor="middle" fill="#6A80A0" font-size="7" letter-spacing="1">localhost:3030</text>

  <!-- Slide preview background -->
  <rect x="10" y="34" width="380" height="276" fill="#ECEEF2"/>

