  <rect x="36" y="234" width="180" height="5" rx="1" fill="#D4D6DA"/>
  <rect x="36" y="246" width="100" height="5" rx="1" fill="#D4D6DA"/>

  <!-- Footer -->
  <rect x="10" y="294" width="380" height="16" fill="#C4C6CA"/>
