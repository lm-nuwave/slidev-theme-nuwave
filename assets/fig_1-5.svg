  <rect x="24" y="88" width="160" height="4" rx="1" fill="#C4C6CA"/>

  <!-- Bullets - plain -->
  <circle cx="32" cy="112" r="3" fill="#6A80A0"/>
  <rect x="42" y="108" width="200" height="7" rx="1" fill="#C4C6CA"/>

  <circle cx="32" cy="130" r="3" fill="#6A80A0"/>
  <rect x="42" y="126" width="170" height="7" rx="1" fill="#C4C6CA"/>

  <circle cx="32" cy="148" r="3" fill="#6A80A0"/>
  <rect x="42" y="144" width="185" height="7" rx="1" fill="#C4C6CA"/>

  <!-- Code block placeholder -->
  <rect x="24" y="170" width="352" height="100" rx="2" fill="#e6e9ef" stroke="#C4C6CA" stroke-width="1"/>
  <rect x="24" y="170" width="352" height="18" rx="2" fill="#C4C6CA"/>
